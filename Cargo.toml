[package]
name = "agent-handoff"
version = "0.3.0"
description = "Hand off local coding sessions between agents in the same Git worktree"
license = "MIT"
readme = "README.md"
edition = "2024"
rust-version = "1.96"

[[bin]]
name = "handoff"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
txcript = { version = "=0.14.4", default-features = false }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tempfile = "3"
